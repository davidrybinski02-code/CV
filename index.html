<title>David Rybinski</title>
<style>
:root{--bg:#EEF1F4;--surface:#fff;--ink:#0F2233;--muted:#5A6B7A;--line:#D6DCE2;--accent:#25598F;--err:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0E141A;--surface:#16202A;--ink:#E8EEF3;--muted:#9AABBA;--line:#263442;--accent:#6BA6E0;--err:#F2B8B5}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 22px;display:grid;gap:14px}
.mark{width:44px;height:44px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;letter-spacing:.03em}
h1{margin:0;font-size:1.4rem;letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:.95rem}
input{font:inherit;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:600 15px/1 inherit;padding:13px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0B1219}}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);min-height:1.3em;font-size:.9rem}
label{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
</style>
</head>
